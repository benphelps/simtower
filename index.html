<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c0c0c0"><title>SimTower</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <div id="native-main-window" class="native-main-window"><div class="window-title"><button class="system" aria-label="System menu">−</button><span class="caption" id="window-caption">SimTower - untitled</span><button class="system" aria-label="Minimize">▾</button><button class="system maximize" aria-label="Maximize">▴</button></div>
  <header class="topbar">
    <nav aria-label="Menu bar"><button class="menu-button" data-menu="file"><u>F</u>ile</button><button class="menu-button" data-menu="options"><u>O</u>ptions</button><button class="menu-button" data-menu="windows"><u>W</u>indows</button><button class="menu-button" data-menu="help"><u>H</u>elp</button></nav>
    <div class="menu-dropdown" id="menu-file"><button id="new"><u>N</u>ew...</button><button id="load"><u>O</u>pen...</button><hr><button id="save"><u>S</u>ave</button><button id="save-as">Save As...</button><hr><button id="exit"><u>E</u>xit</button></div>
    <div class="menu-dropdown" id="menu-options"><div class="submenu"><button>Animation <span class="shortcut">▶</span></button><div class="submenu-items"><button id="toggle-people" data-checked="true" aria-pressed="true">People</button><button id="toggle-effects" data-checked="true" aria-pressed="true">Effects</button></div></div><div class="submenu"><button>Sound <span class="shortcut">▶</span></button><div class="submenu-items"><button id="toggle-sound" data-checked="true" aria-pressed="true">Elevators</button><button id="toggle-background" data-checked="true" aria-pressed="true">Background</button><button id="toggle-events" data-checked="true" aria-pressed="true">Events</button></div></div><div class="submenu"><button>Textures <span class="shortcut">▶</span></button><div class="submenu-items"><button id="textures-upscaled" data-checked="true" aria-pressed="true">Upscaled (waifu2x)</button><button id="textures-original" data-checked="false" aria-pressed="false">Original</button></div></div><button id="fast-mode">Fast Mode</button><hr><button id="call-fire-rescue" disabled>Call Fire Rescue</button></div>
    <div class="menu-dropdown" id="menu-windows"><button id="toggle-tools">Tool Bar</button><button id="toggle-info">Info Bar</button><button id="toggle-map">Map Window</button><hr><button id="finances">Finance Window...</button><hr><button id="find-person">Find Person...</button><button id="find-tenant">Find Tenant...</button></div>
    <div class="menu-dropdown" id="menu-help"><button id="help"><u>C</u>ontents <span class="shortcut">F1</span></button><button id="about"><u>A</u>bout SimTower...</button></div>
  </header>
  <main>



    <section class="viewport" aria-label="Tower view"><canvas id="tower" tabindex="0" aria-label="Interactive tower. Select a facility, then click to build. Drag floors, lobbies, and elevator shafts. Use the scrollbars or map to move the view."></canvas><div class="native-scrollbar horizontal" data-scroll-axis="x" role="scrollbar" aria-label="Horizontal tower scroll" aria-orientation="horizontal"><button class="scroll-arrow back" aria-label="Scroll left"></button><div class="scroll-track"><button class="scroll-thumb" aria-label="Horizontal scroll thumb"></button></div><button class="scroll-arrow forward" aria-label="Scroll right"></button></div><div class="native-scrollbar vertical" data-scroll-axis="y" role="scrollbar" aria-label="Vertical tower scroll" aria-orientation="vertical"><button class="scroll-arrow back" aria-label="Scroll up"></button><div class="scroll-track"><button class="scroll-thumb" aria-label="Vertical scroll thumb"></button></div><button class="scroll-arrow forward" aria-label="Scroll down"></button></div><div class="scroll-corner"></div><div class="view-title"><span id="view-name"></span></div><div class="toast" id="toast" role="status" aria-live="polite"></div><div class="view-help" id="view-help"></div><section id="inspector" class="inspector" hidden></section></section>
  </main><div class="native-resize-edge east" data-resize="e"></div><div class="native-resize-edge south" data-resize="s"></div><div class="native-resize-edge west" data-resize="w"></div><div class="native-resize-edge north" data-resize="n"></div><div class="native-resize-edge southeast" data-resize="se"></div><div class="native-resize-edge southwest" data-resize="sw"></div><div class="native-resize-edge northeast" data-resize="ne"></div><div class="native-resize-edge northwest" data-resize="nw"></div></div>
  <section class="statusbar" aria-label="Info Bar"><div class="native-window-handle" aria-label="Move Info Bar"><button data-hide="info" aria-label="Hide Info Bar"></button></div>
    <div class="tower-title"><input id="tower-name" aria-label="Tower name" maxlength="40" value="untitled"></div>
    <div class="clock-face"><canvas id="clock" width="32" height="31" aria-label="Original clock"></canvas><div class="clock-text"><small id="day">Day 1</small><div class="time"><strong id="time">09:00</strong></div></div></div>
    <div class="rating-stat"><strong id="rating"></strong></div>
    <div class="fund-pop"><div class="stat"><small>Fund</small><strong id="funds">$2,000,000</strong></div><div class="stat"><small>Pop</small><strong id="population">0</strong></div></div>
  </section><aside class="build-panel" aria-label="Tool Bar"><div class="native-window-handle" aria-label="Move Tool Bar"><button data-hide="tools" aria-label="Hide Tool Bar"></button></div><div class="panel-heading"><h1>Tool Bar</h1><span id="mode-label"></span></div><button id="time-control" class="time-control" title="Pause" aria-label="Pause"></button><div class="tool-modes" role="group" aria-label="Tools"><button data-mode="demolish" aria-label="Remove" title="Remove">Remove</button><button data-mode="finger" aria-label="Finger" title="Finger">Finger</button><button data-mode="inspect" aria-label="Inspect" title="Inspect">Inspect</button></div><div id="catalog" class="catalog"></div><div class="selected-tool"><strong id="tool-name"></strong><p id="tool-description"></p><div id="tool-cost"></div></div></aside><div class="map-window"><div class="native-window-handle" aria-label="Move Map Window"><button data-hide="map" aria-label="Hide Map Window"></button></div><div class="map-heading"><span id="floor-count"></span></div><div class="native-map-modes"><button data-map-mode="0" aria-label="Edit view"></button><button data-map-mode="1" aria-label="Evaluation view"></button><button data-map-mode="2" aria-label="Pricing view"></button><button data-map-mode="3" aria-label="Hotel view"></button></div><canvas id="minimap" width="200" height="288" aria-label="Tower overview. Click to navigate."></canvas></div>
  <footer><div id="message"></div><div><span id="occupancy"></span><span id="save-status">Autosave on</span></div></footer>
  <input id="save-file" type="file" accept=".json,application/json" hidden><dialog id="dialog" data-title="SimTower"><button id="dialog-close" class="dialog-close" aria-label="Close dialog">×</button><div id="dialog-content" data-dialog-content></div></dialog><dialog id="schedule-dialog" data-title="Elevator"><div class="native-modeless-caption" aria-label="Move Elevator window"><button id="schedule-system" aria-label="Elevator window menu">−</button></div><div id="schedule-dialog-content" data-dialog-content></div></dialog><div id="loading" role="status" aria-label="Loading SimTower"><img src="/assets/bitmaps/128.png" width="236" height="198" alt="Maxis Presents"><span>Loading SimTower...</span><div class="loading-panel"><div id="loading-progress-label">Preparing assets...</div><div id="loading-progress" role="progressbar" aria-label="Assets loaded" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-progress-fill"></div></div></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
